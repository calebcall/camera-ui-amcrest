name: publish

# Publishes the plugin to npm when a version tag is pushed
# (e.g. `git tag v1.0.4 && git push origin v1.0.4`), or builds without
# publishing on a manual dry run.
#
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN is stored anywhere, so
# there is nothing to rotate. This requires, ONE TIME (see PUBLISHING.md):
#   - `permissions: id-token: write` (below),
#   - npm >= 11.5.1 (upgraded below; kept as a floor guard, not a version bet),
#   - a Trusted Publisher configured on npmjs.com for the package, pointing at
#     this repo + this workflow file. This is a TypeScript plugin (no
#     per-platform binaries), so only the single package
#     @calebcall/camera-ui-amcrest needs it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build + bundle, but do NOT publish to npm.'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1. Node 24 already ships 11.x,
      # so this is a floor guard rather than a fix for a known-old npm.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG — bump package.json (+ CHANGELOG) before tagging."
            exit 1
          fi

      - name: Verify CHANGELOG has an entry for this version
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          VER="$(node -p "require('./package.json').version")"
          ESC="$(printf '%s' "$VER" | sed 's/[.]/\\./g')"
          if ! grep -qE "^## \[?${ESC}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VER}]' entry — update the changelog before releasing."
            exit 1
          fi
          echo "CHANGELOG entry for ${VER} found."

      - name: Install dependencies
        run: npm ci

      - name: Build bundle (tsc + lint/format/test + cui bundle)
        run: npm run bundle

      # A manual dry run stops here — a successful build + bundle is the point.
      - name: Dry run — skipping publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "Dry run: build and bundle succeeded. Not publishing."

      # cui runs `npm publish`; with id-token: write + npm >= 11.5 + a Trusted
      # Publisher configured, it authenticates via OIDC (no token) and emits a
      # provenance attestation. `--yes` skips the interactive confirmation.
      # Runs on a tag push, or a manual run with dry_run unchecked.
      - name: Publish to npm (Trusted Publishing / OIDC)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: npx --no-install cui publish --latest --yes
